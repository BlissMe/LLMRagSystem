<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sinhala Chat Input</title>
  <script src="https://www.google.com/jsapi"></script>
  <script>
    google.load("elements", "1", { packages: "transliteration" });

    function onLoad() {
      const options = {
        sourceLanguage: 'en',
        destinationLanguage: ['si'],
        transliterationEnabled: true
      };

      const control = new google.elements.transliteration.TransliterationControl(options);
      control.makeTransliteratable(['chatBox']);

      // Optional toggle button
      const toggle = document.getElementById('toggleBtn');
      toggle.onclick = () => control.toggleTransliteration();
    }

    google.setOnLoadCallback(onLoad);
  </script>
  <style>
    body {
      font-family: sans-serif;
      margin: 60px auto;
      max-width: 500px;
      text-align: center;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: none;
    }
    button {
      margin-top: 10px;
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h3>Type in Sinhala (Transliteration)</h3>
  <textarea id="chatBox" placeholder="Type 'amma' here..."></textarea><br />
  <button id="toggleBtn">Toggle Sinhala / English</button>
</body>
</html>
